# Overrides de PRODUÇÃO.
# Ative com a variável de ambiente SPRING_PROFILES_ACTIVE=prod.
# A configuração base (banco, JWT, GEE, CORS, etc.) vem de application.properties
# via variáveis de ambiente — defina-as no painel da plataforma de deploy.

# Garante que o SQL NÃO vá para os logs em produção (ruído + risco de expor dados).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
