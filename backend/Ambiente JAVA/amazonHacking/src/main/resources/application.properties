spring.application.name=cred-plus

# Profile ativo por padrão: dev (facilita rodar localmente).
# EM PRODUÇÃO, defina a variável de ambiente SPRING_PROFILES_ACTIVE=prod
# (env var sobrescreve esta linha) para carregar application-prod.properties.
spring.profiles.active=dev

# === Banco de dados ===
# A senha NÃO vai na URL: drivers JDBC e o Spring logam a URL de conexão (banner,
# exceptions, métricas) e isso vazaria a senha nos logs. Por isso ela fica em
# spring.datasource.password, que o Spring sabe mascarar.
spring.datasource.url=jdbc:postgresql://${DB_HOST}/neondb?sslmode=require&channelBinding=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# show-sql DESLIGADO por padrão (produção). O profile dev liga novamente.
spring.jpa.show-sql=false

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# === Segurança / JWT ===
api.security.token.secret=${JWT_SECRET}

# === Google Earth Engine ===
cred.plus.id=credplus-495801
gee.absolute.key.path=${GEE_KEY_PATH}
# URL do microserviço Python (GEE/AgroScore). Em produção, defina PYTHON_SERVICE_URL
# com a URL https do deploy. Mantemos GEE_PYTHON_URL como nome antigo (compatibilidade)
# e localhost como padrão de desenvolvimento local.
gee.python-url=${PYTHON_SERVICE_URL:${GEE_PYTHON_URL:http://localhost:5000}}
gee.timeout-seconds=120

# A cada quanto tempo (em ms) o sistema tenta recalcular safras que ficaram sem
# AgroScore (ex.: serviço Python estava fora do ar no cadastro). Padrão: 5 minutos.
agroscore.reconciliacao.intervalo-ms=300000

# === Servidor ===
# A maioria das plataformas (Render/Railway/Heroku) injeta a variável PORT e
# espera que o app escute nela. Usamos PORT quando existir; senão, 8080 (dev local).
server.port=${PORT:8080}
# Prefixo comum de todos os endpoints da API (ex.: /cred/auth/login, /cred/safras).
server.servlet.context-path=/cred

# === Upload de imagens (Cloudinary) ===
cloudinary.url=${CLOUDINARY_URL:}
# Limites de upload. Protege contra arquivos gigantes (DoS).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# === CORS ===
# Origens liberadas. Em produção, defina CORS_ALLOWED_ORIGINS com as URLs https
# dos frontends (separadas por vírgula). O default abaixo cobre o dev local.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# === Seed ===
# Popular dados de demonstração no start. Desligado por padrão.
# Rode com -Dseed.enabled=true (ou defina como true) para popular o banco uma vez.
seed.enabled=false
